name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check the syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "-> bash -n $file"
            bash -n "$file"
          done < <(find scripts -name '*.sh')

      - name: Check the Makefile
        run: |
          set -euo pipefail
          make version
          make release

  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check the YAML syntax
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pyyaml ||
            python3 -m pip install --quiet --user pyyaml
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          failed = False
          for path in sorted(glob.glob('.github/workflows/*.y*ml')):
              try:
                  with open(path, encoding='utf-8') as handle:
                      yaml.safe_load(handle)
              except Exception as error:
                  failed = True
                  print(f'FAIL {path}: {error}')
                  continue
              print(f'OK   {path}')

          sys.exit(1 if failed else 0)
          PY

      - name: Check the workflow files with actionlint
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
