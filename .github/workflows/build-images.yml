name: Docker Image

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target image'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - windows
          - macos
          - dind
          - release
      version:
        description: 'Version of the source archive, defaults to the latest source release'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  build-images:
    # The images hold the whole Firefox source tree, they need a lot of disk.
    # Set the repository variable BUILD_RUNNER_JSON to a bigger runner if the
    # default one is too small.
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # A single target can be built with the input, otherwise all of them.
        target: ${{ fromJSON(inputs.target != '' && format('["{0}"]', inputs.target) || '["linux","windows","macos","dind","release"]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name and the source version
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/buildenv" >> "$GITHUB_OUTPUT"

          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          fi

          # A failed request answers with the body of the error, keep only
          # something that looks like a version.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+)*(-[0-9]+)?$'; then
            version=""
          fi

          if [ -z "$version" ]; then
            if [ "$TARGET" = "release" ] || [ "$TARGET" = "dind" ]; then
              # These images hold no Firefox source, they do not need one.
              echo "::notice::No source release was found, the image $TARGET does not need one"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "source_url=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No source release was found. Run the 'Create Source Code Release' workflow first or set the version input."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_url=https://github.com/$owner/librewolf-source/releases/download/$version/librewolf-$version.source.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ matrix.target }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE_URL=${{ steps.meta.outputs.source_url }}
            FORGE_URL=https://github.com
            FORGE_REPO_OWNER=${{ github.repository_owner }}
            PUBKEY=${{ vars.PUBKEY }}
            DOCKER_GPG_KEY=${{ vars.DOCKER_GPG_KEY }}
            OSSIGN_ASC_KEY=${{ vars.OSSIGN_ASC_KEY }}
