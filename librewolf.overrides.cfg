// The settings of LibreWolf of the fork.
//
// This file is read by the browser at every start, it changes the settings
// that are set in the build of the browser. Put it in the profile of the
// browser, the path of the file depends on the system:
//
//   Windows: %USERPROFILE%\.librewolf\librewolf.overrides.cfg
//   Linux:   $XDG_CONFIG_HOME/librewolf/librewolf/librewolf.overrides.cfg
//
// Every setting here can be changed by the user, the values that are not in
// this file stay the way the build of the browser has them.

/** [SECTION] THE VIDEO OF THE PAGES
 * The video of the pages is decoded by the codecs of the system, the videos
 * of YouTube play without a break and without the tearing of the picture.
 */
pref("webgl.disabled", false);
pref("media.av1.enabled", true);
pref("media.av1.use-dav1d", true);
pref("media.webm.enabled", true);
pref("media.wmf.enabled", true);
pref("media.ffmpeg.vaapi.enabled", false);

/** [SECTION] THE COOKIES, THE SESSIONS AND THE LOCAL COLLECTIONS
 * The cookies and the local storage of the sites are not removed when the
 * browser is closed, the authorizations of GitHub, of YouTube and of
 * KeePassXC survive, and the local collections of Hoppscotch are kept.
 */
pref("privacy.clearOnShutdown.cookies", false);
pref("privacy.clearOnShutdown.offlineApps", false);
pref("privacy.clearOnShutdown.sessions", false);
pref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
pref("privacy.clearOnShutdown_v2.offlineApps", false);
pref("privacy.clearOnShutdown_v2.sessions", false);
pref("privacy.sanitize.sanitizeOnShutdown.historyFormDataAndDownloads", false);
pref("browser.sessionstore.resume_from_crash", true);

/** [SECTION] THE LOCAL DEVELOPMENT
 * The requests to the local machine are not sent to the resolver of the
 * network and they are not blocked, the local api and the server of the
 * agents of the fork work out of the box.
 */
pref("network.dns.localDomains", "localhost,localhost.localdomain,.localhost");
pref("network.proxy.allow_hijacking_localhost", true);
pref("network.proxy.testing_localhost_is_secure_when_hijacked", true);
