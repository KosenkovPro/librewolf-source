<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MCP console</title>
    <style>
      body {
        font: 13px system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        color: #fbfbfe;
        background: #1c1b22;
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100vh;
        box-sizing: border-box;
      }
      h1 {
        font-size: 14px;
        margin: 0;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #8f8f9d;
      }
      .dot.on {
        background: #2ac769;
      }
      button {
        padding: 5px 10px;
        border-radius: 5px;
        border: 1px solid #4a4a52;
        background: #2b2a33;
        color: #fbfbfe;
        cursor: pointer;
      }
      button:hover {
        background: #3a3944;
      }
      button.primary {
        background: #0060df;
        border-color: #0060df;
      }
      button.recording {
        background: #ff3b30;
        border-color: #ff3b30;
      }
      details {
        border: 1px solid #4a4a52;
        border-radius: 6px;
        padding: 6px 8px;
      }
      summary {
        cursor: pointer;
        color: #b1b1bd;
      }
      label {
        display: block;
        margin: 6px 0;
      }
      input[type="text"],
      textarea {
        width: 100%;
        box-sizing: border-box;
        background: #0f0f14;
        color: #fbfbfe;
        border: 1px solid #4a4a52;
        border-radius: 5px;
        padding: 5px 7px;
        font: inherit;
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      .log {
        flex: 1;
        overflow-y: auto;
        background: #0f0f14;
        border: 1px solid #4a4a52;
        border-radius: 6px;
        padding: 6px 8px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.5;
      }
      .log div {
        word-break: break-word;
      }
      .log .error {
        color: #ff8a80;
      }
      .log .info {
        color: #b1b1bd;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .row button {
        flex: none;
      }
    </style>
  </head>
  <body>
    <h1>MCP console</h1>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status">not connected</span>
      <button id="connect" class="primary">Connect</button>
    </div>

    <details>
      <summary>Settings</summary>
      <label>
        The address of the MCP server
        <input type="text" id="server" />
      </label>
      <label>
        The address of the speech to text service
        <input type="text" id="stt" />
      </label>
      <button id="save">Save</button>
    </details>

    <div class="row">
      <textarea id="prompt" placeholder="Write a task for the agent…"></textarea>
    </div>
    <div class="row">
      <button id="voice" title="Say the task">🎙 Voice</button>
      <button id="send" class="primary">Send to the agent</button>
    </div>

    <div class="log" id="log"></div>

    <script src="panel.js"></script>
  </body>
</html>
