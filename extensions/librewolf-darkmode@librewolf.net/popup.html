<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LibreWolf Dark Mode</title>
    <style>
      body {
        font: 13px system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 300px;
        color: #fbfbfe;
        background: #1c1b22;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      .domain {
        color: #b1b1bd;
        font-size: 12px;
        margin-bottom: 10px;
        word-break: break-all;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      button {
        flex: 1;
        padding: 6px 8px;
        border-radius: 5px;
        border: 1px solid #4a4a52;
        background: #2b2a33;
        color: #fbfbfe;
        cursor: pointer;
      }
      button:hover {
        background: #3a3944;
      }
      button.active {
        background: #0060df;
        border-color: #0060df;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      label span {
        display: flex;
        justify-content: space-between;
        margin-bottom: 3px;
        color: #b1b1bd;
      }
      input[type="range"] {
        width: 100%;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #b1b1bd;
        margin: 14px 0 6px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 110px;
        overflow-y: auto;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
      }
      li button {
        flex: none;
        padding: 2px 8px;
      }
      .empty {
        color: #8f8f9d;
      }
    </style>
  </head>
  <body>
    <h1>Dark mode</h1>
    <div class="domain" id="domain">…</div>

    <div class="row" id="modes">
      <button data-mode="on">On</button>
      <button data-mode="off">Off</button>
      <button data-mode="inherit">System</button>
    </div>

    <label>
      <span>Brightness <b id="brightness-value">1.00</b></span>
      <input type="range" id="brightness" min="0.6" max="1.4" step="0.05" />
    </label>

    <label>
      <span>Contrast <b id="contrast-value">1.00</b></span>
      <input type="range" id="contrast" min="0.6" max="1.6" step="0.05" />
    </label>

    <h2>All websites</h2>
    <div class="row" id="global">
      <button data-global="auto">System</button>
      <button data-global="on">Always on</button>
      <button data-global="off">Always off</button>
    </div>

    <h2>Exceptions</h2>
    <ul id="exceptions"></ul>

    <script src="popup.js"></script>
  </body>
</html>
